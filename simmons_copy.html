<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./reset.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lexend+Giga:wght@100..900&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: "Noto Sans KR", sans-serif;
        }
        header{
            width: 100%;
            height: 125px;
            background-color: white;
            position: fixed;
            z-index: 20;
        }
        nav{
            width: min(1400px, 80%);
            margin: 0 auto;
            height: 100%;
        }
        .nav_top{
            height: 50%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo{
            width: 125px;
        }
        .logo > img{
            object-fit: cover;
        }
        .top_header{
            display: flex;
            font-size: 13px;
            font-weight: 600;
        }
        .top_header ul{
            display: flex;
            padding: 0 15px;
            gap: 20px;
            border-right: 1px solid #ddd;
        }
        .top_header ul:last-child{
            border-right: none;
            padding-right: 0;
        }
        .nav_bottom{
            height: 50%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bottom_header{
            display: flex;
            font-size: 14px;
            font-weight: 600;
        }
        .bottom_header ul{
            display: flex;
            gap: 20px;
            padding: 0 15px;
            color: #ccc;
        }
        .bottom_header ul li{
            transition: all 0.6s;
        }
        .bottom_header ul li.on{
            color: black;
        }
        .bottom_header ul:first-child{
            padding-left: 0;
            border-right: 1px solid #ddd;
        }
        .bottom_icon ul{
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
        }
        .slide_wrap{
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .slide{
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0; top: 0;
            display: none;
        }
        .slide img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slide:first-child{
            display: block;
        }
        .arrow{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            line-height: 50px;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .arrow img{
            width: 25px;
        }
        .prev{
            left: 50px;
        }
        .next{
            right: 50px;
        }
        .dotWrap{
            display: flex;
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .dot{
            width: 80px;
            height: 4px;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .dot.on{
            background-color: black;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="nav_top">
                <div class="logo"><img src="./img/simmons_logo.png" alt="logo"/></div>
                <div class="top_header">
                    <ul>
                        <li><a href="#">매장 안내</a></li>
                        <li><a href="#">팩토리움 투어 예약</a></li>
                    </ul>
                    <ul>
                        <li><a href="#">회원가입</a></li>
                        <li><a href="#">로그인</a></li>
                        <li><a href="#">고객센터</a></li>
                    </ul>
                    <ul>
                        <li><a href="#"><img src="./img/insta_icon.png" alt="instagram"/></a></li>
                        <li><a href="#"><img src="./img/youtu_icon.png" alt="youtube"/></a></li>
                        <li><a href="#"><img src="./img/blog_icon.png" alt="blog"/></a></li>
                        <li><a href="#"><img src="./img/kakao_icon.png" alt="kakao"/></a></li>
                    </ul>
                </div>
            </div>
            <div class="nav_bottom">
                <div class="bottom_header">
                    <ul>
                        <li><a href="#">브랜드소개</a></li>
                    </ul>
                    <ul>
                        <li><a href="#">전체보기</a></li>
                        <li><a href="#">뷰티레스트 블랙</a></li>
                        <li><a href="#">뷰티레스트 매트리스</a></li>
                        <li><a href="#">프레임</a></li>
                        <li><a href="#">협탁</a></li>
                        <li><a href="#">파운데이션</a></li>
                        <li><a href="#">펫 매트리스</a></li>
                        <li><a href="#">베딩</a></li>
                        <li><a href="#">프래그런스</a></li>
                        <li><a href="#">가구</a></li>
                        <li><a href="#">아울렛</a></li>
                    </ul>
                </div>
                <div class="bottom_icon">
                    <ul>
                        <li><a href="#"><img src="./img/shoppingbag_icon.png" alt="shoppingbag"/></a></li>
                        <li><a href="#"><img src="./img/search_icon.png" alt="search"/></a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div slide_wrap>
        <div class="slide">
            <img src="./img/slide_1.png" alt="slide1"/>
        </div>
        <div class="slide">
            <img src="./img/slide_2.png" alt="slide2"/>
        </div>
        <div class="slide">
            <img src="./img/slide_3.png" alt="slide3"/>
        </div>
        <div class="slide">
            <img src="./img/slide_4.png" alt="slide4"/>
        </div>
        <div class="slide">
            <img src="./img/slide_5.png" alt="slide5"/>
        </div>

        <button class="arrow prev"><img src="./img/prev.png"/></button>
        <button class="arrow next"><img src="./img/next.png"/></button>

        <div class="dotWrap">
            <div class="dot on"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    <script>
        const bottomHeader = $(".bottom_header > ul > li")
        const slides = $(".slide")
        const dots = $(".dot")

        let index = 0

        bottomHeader.addClass("on")

        bottomHeader.on("mouseenter", function(){
            bottomHeader.removeClass("on")
            $(this).addClass("on")
        })

        bottomHeader.on("mouseleave", function(){
            bottomHeader.addClass("on")
        })
        function moveSlide(){
            slides.stop(true, true).fadeOut(500)
            slides.eq(index).stop(true, true).fadeIn(500)

            dots.removeClass("on")
            dots.eq(index).addClass("on")

        }
        $(".next").on("click", function(){
            index++
            if(index >= slides.length){
                index = 0
            }
            moveSlide()
        })

        $(".prev").on("click", function(){
            index--
            if(index < 0){
                index = slides.length - 1 // 2->1->0->2
            }
            moveSlide()
        })

    </script>
</body>
</html>
